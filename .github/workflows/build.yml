name: Build and optionally sign

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Request SignPath signing (version tag and configured account required)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  motor:
    # Real end-to-end check of the embedded AI: downloads engine + model, verifies hashes, starts llama-server, chats once.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile
        shell: powershell
        run: .\Compilar.ps1
      - name: Embedded AI end to end
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $env:TITO_ROOT = $root
          $runtime = Join-Path $root ([IO.File]::ReadAllText((Join-Path $root 'current-version.txt')).Trim())
          $p = Start-Process -FilePath $runtime -ArgumentList '--motor-test' -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(1500000)) { $p.Kill(); throw 'motor-test timed out' }
          Get-Content (Join-Path $root 'Dados\motor-test.txt')
          if ($p.ExitCode -ne 0) { throw ('motor-test failed: ' + $p.ExitCode) }
      - name: Report engine signature (Smart App Control notes)
        if: always()
        shell: powershell
        run: |
          Get-ChildItem Dados\motor -ErrorAction SilentlyContinue -Recurse -Filter 'llama-server.exe' | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "$($_.FullName): $($s.Status) $($s.SignerCertificate.Subject)"
          }
          Get-ChildItem Dados\motor -ErrorAction SilentlyContinue -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { "$($_.Name) $((Get-AuthenticodeSignature $_.FullName).Status)" }

  build:
    runs-on: windows-2022
    permissions:
      contents: write # only to refresh the lab-previews branch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile
        shell: powershell
        run: .\Compilar.ps1
      - name: Laboratorio (checks, screenshots, summary)
        shell: powershell
        run: .\scripts\Laboratorio.ps1 -SkipBuild
      - name: Upload WPF visual checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tito-visual-previews
          path: |
            Dados/laboratorio*
            Dados/preview-*.png
            Dados/preview-notes.txt
            Dados/morph/*.png
          if-no-files-found: error
      - name: Publish lab screenshots to lab-previews branch
        if: always() && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'lab'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item Dados\laboratorio*, Dados\preview-*.png $out
          Set-Location $out
          git init -q; git checkout -q -b lab-previews
          git config user.name 'github-actions'; git config user.email 'actions@users.noreply.github.com'
          git add -A; git commit -q -m ("Lab screenshots " + $env:GITHUB_SHA)
          git push -q -f ("https://x-access-token:" + $env:GITHUB_TOKEN + "@github.com/" + $env:GITHUB_REPOSITORY + ".git") lab-previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package unsigned build
        shell: powershell
        run: .\scripts\Package.ps1 -SkipBuild
      - name: Upload verifiable unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tito-windows-unsigned
          path: dist/Tito-Windows-unsigned.zip
          if-no-files-found: error
      - name: Check signing configuration
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        shell: powershell
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNING_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNING_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/v')) { throw 'Signing requires a version tag.' }
          foreach ($name in @('SIGNING_TOKEN','SIGNING_ORG','SIGNING_PROJECT','SIGNING_POLICY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing setting: $name" }
          }
      - name: Submit manual signing request
        if: github.event_name == 'workflow_dispatch' && inputs.sign && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Verify returned signed ZIP
        if: github.event_name == 'workflow_dispatch' && inputs.sign && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $archive = Get-ChildItem signed -Filter '*.zip' -Recurse
          if (@($archive).Count -ne 1) { throw 'Expected exactly one signed distribution ZIP.' }
          .\scripts\Verify-SignedPackage.ps1 -Archive $archive.FullName
          Copy-Item -LiteralPath $archive.FullName -Destination dist/Tito-Windows.zip
      - name: Upload verified signed artifact
        if: github.event_name == 'workflow_dispatch' && inputs.sign && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tito-windows-signed
          path: dist/Tito-Windows.zip
          if-no-files-found: error
